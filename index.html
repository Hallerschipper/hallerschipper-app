<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallerschipper</title>
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <img src="logo.png" alt="Hallerschipper Logo" class="logo">
    <div>
      <h1>Hallerschipper</h1>
      <p class="subtitle">Liederbuch für den Shantychor</p>
    </div>
  </header>

  <main class="wrap">
    <section id="listView" class="card">
      <input type="text" id="search" placeholder="Lied suchen..." aria-label="Lied suchen">
      <div class="meta"><span id="count"></span></div>
      <ul id="songList" class="song-list"></ul>
    </section>

    <section id="detailView" class="card hidden">
      <button id="backBtn" class="back-btn">← Zurück zur Liste</button>
      <h2 id="songTitle"></h2>
      <pre id="songText" class="lyrics"></pre>
    </section>
  </main>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
