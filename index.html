<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallerschipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="logo.png" alt="Hallerschipper Logo" style="max-width: 220px; width: 100%; display: block; margin: 0 auto 20px auto;">
    <h1>Hallerschipper Lieder</h1>
  </header>

  <main>
    <section id="listView">
      <input id="search" type="text" placeholder="Suche nach Nummer, Titel oder Text...">

      <select id="categoryFilter">
        <option value="Alle">Alle Kategorien</option>
      </select>

      <p id="count"></p>

      <ul id="songList"></ul>
    </section>

    <section id="detailView" class="hidden">
      <button id="backBtn" type="button">← Zurück</button>
      <p id="songCategory"></p>
      <h2 id="songTitle"></h2>
      <pre id="songText"></pre>
    </section>
  </main>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
